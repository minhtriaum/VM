<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VM Task Manager v3.6</title>
<style>
:root{
  --bg:#f4f6fa;--surface:#fff;--ink:#1c2333;--muted:#6b7488;--line:#e2e6ee;
  --brand:#3b5bdb;--brand-d:#2f49b0;--brand-l:#e8edff;
  --assign:#d9822b;--assign-l:#fff1e0;
  --prog:#2f7de1;--prog-l:#e3efff;
  --done:#2e9e6a;--done-l:#e0f5ec;
  --ans:#8a4fd1;--ans-l:#f1e8fc;
  --danger:#d64545;--radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:15px;line-height:1.45}
button{font:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;color:inherit}
code{background:#eef0f4;border-radius:5px;padding:1px 6px;font-size:13px}
.app{max-width:960px;margin:0 auto;padding:0 16px 80px}
.hide{display:none!important}
#rSortSel,#vSortSel,#oSortSel{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:14px;color:var(--ink)}
.attl{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.impbar{display:flex;gap:8px;margin-left:auto;align-items:center}
.fold{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fafbfd}.fold summary{cursor:pointer;font-weight:600;font-size:13.5px;color:var(--muted)}
.rrow.head .sortable,.row.head .sortable{cursor:pointer;user-select:none}.rrow.head .sortable:hover{color:var(--ink)}

header.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 0 0;border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hrow.a{margin-bottom:4px}
header.top h1{margin:0;font-size:20px;letter-spacing:-.3px;display:flex;align-items:baseline;gap:8px;flex:1;min-width:180px}
.ver{font-size:12px;font-weight:600;color:var(--brand);background:var(--brand-l);padding:2px 8px;border-radius:999px}
.me{font-size:13px;color:var(--muted)}
.me b{color:var(--ink)}
.today{font-size:12.5px;color:var(--muted);flex:1;margin-bottom:6px}
.menu{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px}
.mbtn{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px;color:var(--muted)}
.mbtn.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tabs{display:grid;gap:0;margin-top:2px}
.tab{border:0;background:transparent;padding:8px 4px 8px;border-bottom:3px solid transparent;color:var(--muted);font-weight:600;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.2}
.tab b{font-size:18px;color:var(--ink);font-weight:700}
.tab.on{color:var(--brand);border-bottom-color:var(--brand)}.tab.on b{color:var(--brand)}
.tab[data-f="배정"].on,.tab[data-f="접수"].on{color:var(--assign);border-bottom-color:var(--assign)}.tab[data-f="배정"].on b,.tab[data-f="접수"].on b{color:var(--assign)}
.tab[data-f="진행"].on{color:var(--prog);border-bottom-color:var(--prog)}.tab[data-f="진행"].on b{color:var(--prog)}
.tab[data-f="답변"].on,.tab[data-f="협업진행"].on{color:var(--ans);border-bottom-color:var(--ans)}.tab[data-f="답변"].on b,.tab[data-f="협업진행"].on b{color:var(--ans)}
.tab[data-f="완료"].on{color:var(--done);border-bottom-color:var(--done)}.tab[data-f="완료"].on b{color:var(--done)}
.tabs .tab[data-f="배정"].on{color:var(--prog);border-bottom-color:var(--prog)}.tabs .tab[data-f="배정"].on b{color:var(--prog)}
.tabs.vm .tab[data-f="배정"].on{color:var(--assign);border-bottom-color:var(--assign)}.tabs.vm .tab[data-f="배정"].on b{color:var(--assign)}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:9px;color:var(--ink);font-weight:500}
.btn:hover:not(:disabled){border-color:#c7cddb}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--brand-d)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:13px}
.view{display:none;padding-top:16px}
.view.on{display:block}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.expbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.explbl{font-size:12.5px;color:var(--muted);font-weight:600}
.search{flex:1 1 160px;min-width:140px;border:1px solid var(--line);border-radius:9px;padding:8px 12px;background:var(--surface)}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip b{margin-left:4px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.row{display:grid;grid-template-columns:96px 64px 1fr 130px;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.head{background:#fafbfd;color:var(--muted);font-size:12.5px;font-weight:600;padding:9px 16px}
.row.item{cursor:pointer}
.row.item:hover{background:#f8faff}
.row .t{font-weight:600;word-break:break-word}
.row .t small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .who{color:var(--muted);font-size:13.5px}
.row .date{font-size:12.5px}
.row .kind .cat{margin:0}.cat.task{background:var(--prog-l);color:var(--prog)}.cat.share{background:var(--brand-l);color:var(--brand)}
.row .t .badge,.rrow .t .badge{padding:1px 8px;font-size:11.5px;margin-right:6px;vertical-align:1px}
.tno{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom;background:var(--brand-l);color:var(--brand);font-weight:700;font-size:13px;padding:2px 9px;border-radius:6px}
.rrow.item .t{font-size:16px;line-height:1.35}
.rrow.item .m{font-size:12.5px}
.rrow.item .tno{font-size:12.5px}
.rrow.item .dt{font-size:12.5px}
.rrow.item .t small{font-size:12px;margin-top:2px}
.rrow.item .t .badge{font-size:11px;padding:1px 7px}
.rrow.item .rpl{font-size:11px}
.rrow.head{font-size:12px}
.rpl{font-size:11.5px;font-weight:700;color:var(--ans);margin-left:6px}
.rrow>div{min-width:0}
.rrow .m{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow.item .t{overflow:hidden}
.rrow .own{font-weight:700;color:var(--ink)}
@media(max-width:640px){
  .rrow.rm{display:grid!important;grid-template-columns:auto auto minmax(0,1fr) auto!important;grid-template-areas:"n c o d" "t t t t";gap:4px 8px!important;padding:10px 12px;align-items:center}
  .rrow.rm>div:nth-child(1){grid-area:n}.rrow.rm>div:nth-child(2){grid-area:d;text-align:right}.rrow.rm>div:nth-child(3){grid-area:c}.rrow.rm>div:nth-child(4){grid-area:t;order:0}.rrow.rm>div:nth-child(5){grid-area:o}
  .rrow.rm .m{font-size:11px}.rrow.rm .m .dt{font-size:11px}.rrow.rm .tno{font-size:11px;padding:1px 7px}
  .rrow.rm .t{font-size:12px;line-height:1.4}.rrow.rm .t small{font-size:10.5px;margin-top:1px}
  .rrow.rm .t .badge{font-size:10px;padding:0 6px}.rrow.rm .rpl{font-size:10px}
}
.dt{color:var(--muted);white-space:nowrap}
.dt em{font-style:normal;margin-left:2px;font-weight:600}
.dt em.sun{color:#d64545}.dt em.sat{color:#2f7de1}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.badge.s0{background:var(--assign-l);color:var(--assign)}
.badge.s1{background:var(--prog-l);color:var(--prog)}
.badge.s2{background:var(--done-l);color:var(--done)}
.badge.s3{background:var(--ans-l);color:var(--ans)}
.cat{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:6px;background:#eef0f4;color:#4a5368;margin-right:5px}
.empty{padding:48px 16px;text-align:center;color:var(--muted)}
@media(max-width:640px){
  .row{grid-template-columns:1fr auto;grid-template-areas:"d k" "t t" "w w";gap:4px 10px}
  .row.head{display:none}
  .row .date{grid-area:d}.row .t{grid-area:t}.row .who{grid-area:w}.row .kind{grid-area:k}
  .rrow{display:flex!important;flex-wrap:wrap;gap:4px 10px!important}
  .rrow>div{flex:0 1 auto}.rrow>.grow{flex:1 1 100%;order:5}.rrow.head{display:none!important}
}
.rrow{display:grid;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.rrow:last-child{border-bottom:0}
.rrow.head{background:#fafbfd;color:var(--muted);font-size:12.5px;font-weight:600;padding:9px 16px}
.rrow.item{cursor:pointer}.rrow.item:hover{background:#f8faff}
.rrow .t{font-weight:600;word-break:break-word}
.rrow .t small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .m{color:var(--muted);font-size:13.5px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.panel h2{margin:0 0 12px;font-size:16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:600}
.field input[type=text],.field input[type=date],.field input[type=password],.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:#fff}
.field textarea{min-height:140px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus,.search:focus{outline:2px solid var(--brand-l);border-color:var(--brand)}
.dline{display:flex;align-items:center;gap:8px}
.dline input{flex:1}
.wd{flex:none;font-weight:700;font-size:13px;padding:6px 10px;border-radius:8px;background:#eef0f4;color:var(--muted)}
.wd.sun{background:#fde8e8;color:#d64545}.wd.sat{background:#e3efff;color:#2f7de1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:12px}
@media(max-width:560px){.two,.three{grid-template-columns:1fr}}
.stepedit{display:grid;grid-template-columns:28px 1fr 150px auto;gap:6px;align-items:center;margin-bottom:8px}
.stepedit .no{width:26px;height:26px;border-radius:50%;background:var(--brand-l);color:var(--brand);font-weight:700;font-size:13px;display:grid;place-items:center}
.stepedit input{border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.stepedit .acts{display:flex;gap:3px}
.icon{border:1px solid var(--line);background:#fff;border-radius:7px;width:30px;height:32px;padding:0;color:var(--muted)}
.icon:hover:not(:disabled){color:var(--ink);border-color:#c7cddb}
@media(max-width:560px){
  .stepedit{grid-template-columns:28px 1fr;grid-template-areas:"n a" ". o" ". c"}
  .stepedit .no{grid-area:n}.stepedit .nm{grid-area:a}.stepedit .ow{grid-area:o}.stepedit .acts{grid-area:c}
}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.actions .sp{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 4px 18px rgba(30,40,80,.06)}
.card .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;margin-bottom:6px}
.card h2{margin:0 0 4px;font-size:22px;letter-spacing:-.3px;word-break:break-word}
.card .who{color:var(--muted);font-size:14px}
.kv{display:grid;grid-template-columns:90px 1fr;gap:6px 12px;margin:12px 0;font-size:14.5px}
.kv dt{color:var(--muted);font-weight:600}.kv dd{margin:0;word-break:break-word}
.body{white-space:pre-wrap;word-break:break-word;background:#fafbfd;border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:10px}
.prog{height:6px;background:var(--line);border-radius:99px;margin:14px 0 4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--done);transition:width .25s}
.progtxt{font-size:12.5px;color:var(--muted);margin-bottom:10px}
.flowtitle{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;margin:14px 0 8px}
.flow{display:flex;flex-direction:column;align-items:stretch}
.node{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff}
.node.done{background:#f3fbf7;border-color:#cdeedd}
.node .no{flex:none;width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center}
.node.done .no{background:var(--done)}
.node .nm{flex:1;font-weight:600;word-break:break-word}
.node.done .nm{text-decoration:line-through;color:var(--muted)}
.node .ow{flex:none;background:var(--brand-l);color:var(--brand);padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600}
.node .ow.none{background:#eef0f4;color:var(--muted)}
.node input[type=checkbox]{width:18px;height:18px;accent-color:var(--done);flex:none}
.arrow{align-self:center;color:#aab2c5;font-size:18px;line-height:1;padding:3px 0}
.imgonly{display:none!important}body.img-on .imgonly{display:inline-flex!important}
.imgopt{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);padding:0 4px;cursor:pointer}
.sharebar .push{margin-left:auto;display:flex;gap:8px}
.savebtn{background:var(--ink)!important;border-color:var(--ink)!important;color:#fff!important}
.autost{font-size:12.5px;color:var(--muted);margin-top:12px;min-height:18px}.autost.ok{color:var(--done)}.autost.err{color:#c2304a}
.autod{font-size:12.5px;color:var(--muted);align-self:center}
.sharebar{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px dashed var(--line)}
.stbtns{display:flex;gap:6px;flex-wrap:wrap}.stb{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.stb.on.s0{background:var(--assign-l);color:var(--assign);border-color:var(--assign)}.stb.on.s1{background:var(--prog-l);color:var(--prog);border-color:var(--prog)}.stb.on.s2{background:var(--done-l);color:var(--done);border-color:var(--done)}.stb.on.s3{background:var(--ans-l);color:var(--ans);border-color:var(--ans)}
.stsel{border:1px solid var(--line);border-radius:999px;padding:3px 8px;background:#fff;font-weight:600;font-size:13px}
.srow{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow span{flex:1}
.addrow{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.addrow input,.addrow select{flex:1;min-width:120px;border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:#fff}
.settop{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.settop h2{margin:0;flex:1;font-size:18px}
.note{margin-bottom:18px}
.note h3{margin:0 0 6px;font-size:15px}
.note h3 small{color:var(--muted);font-weight:400;margin-left:6px}
.note ul{margin:0;padding-left:20px;color:#3a4358}
.hint{color:var(--muted);font-size:13px;margin:0 0 10px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;margin-left:6px}
.tag.admin{background:#ffe8ec;color:#c2304a}.tag.manager{background:var(--brand-l);color:var(--brand)}.tag.must{background:var(--assign-l);color:var(--assign)}.tag.code{background:var(--done-l);color:var(--done)}
.acc{border-bottom:1px solid var(--line);padding:10px 0}
.acc:last-child{border-bottom:0}

.perms{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px 12px;margin-top:10px;padding:10px 12px;background:#fafbfd;border:1px solid var(--line);border-radius:10px}
.perms label{font-size:13.5px;display:flex;gap:7px;align-items:center}
details summary{cursor:pointer;color:var(--brand);font-size:13px;font-weight:600;margin-top:6px}
.mrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow input[type=text]{width:140px;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.mrow .desc{color:var(--muted);font-size:12.5px;flex:1;min-width:90px}
.mrow label{font-size:13.5px;display:flex;gap:5px;align-items:center}
.outs{display:flex;gap:10px;flex-wrap:wrap}

.stat small{display:block;color:var(--muted);margin-top:4px}

.hdsel{display:flex;gap:6px;flex-wrap:wrap}

.stepedit.f3{grid-template-columns:28px 1fr auto}

  .stepedit.f3{grid-template-columns:28px 1fr;grid-template-areas:"n a" ". c"}

.rrflow{display:flex;flex-wrap:wrap;gap:8px 4px;align-items:center;margin:8px 0 4px}

.flash{animation:flashrow 2.6s ease}
@keyframes flashrow{0%,55%{background:#fff3c4}100%{background:transparent}}
.field .dline input.dsm{width:148px;flex:none;font-size:13px;padding:5px 8px}
.dline .wd{font-size:12px;padding:5px 8px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#1c2333;color:#fff;padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:80;font-size:14px;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.loginbox{max-width:360px;margin:40px auto 0}
.loginbox h2{text-align:center;margin-bottom:4px}
.loginbox .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:16px}
.err{color:var(--danger);font-size:13px;min-height:18px;margin:4px 0 8px}
.linkbtn{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;margin-top:14px;display:block;width:100%;text-align:center}
.overlay{position:fixed;inset:0;background:rgba(20,26,45,.5);z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
.overlay.on{display:flex}
.modal{background:#fff;border-radius:14px;padding:22px;width:100%;max-width:380px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.modal h2{margin:0 0 6px;font-size:17px}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="hrow a">
      <h1>VM Task Manager <span class="ver" id="verBadge"></span></h1>
      <span class="me hide" id="meBox"><b id="meName"></b></span>
      <button class="btn sm hide" id="pwBtn">비밀번호 변경</button>
      <button class="btn sm" id="gearBtn" title="설정" aria-label="설정">⚙</button>
      <button class="btn sm hide" id="outBtn">로그아웃</button>
    </div>
    <div class="hrow"><span class="today" id="today"></span></div>
    <nav class="menu hide" id="menu"></nav>
    <nav class="tabs hide" id="tabs"></nav>
  </header>

  <!-- 접근 코드 입력 -->
  <section class="view on" id="v-gate">
    <div class="panel loginbox">
      <h2>VM Task Manager</h2>
      <div class="field"><input type="password" id="gCode" autocomplete="off" autocapitalize="off"></div>
      <div class="err" id="gErr"></div>
      <button class="btn primary" id="gBtn" style="width:100%">입장</button>
    </div>
  </section>

  <!-- 설정 계정 로그인 -->
  <section class="view" id="v-slogin">
    <div class="panel loginbox">
      <h2>설정 로그인</h2>
      <div class="sub">설정 페이지는 계정으로 로그인합니다</div>
      <div class="field"><label>아이디</label><input type="text" id="lId" autocomplete="username" autocapitalize="off"></div>
      <div class="field"><label>비밀번호</label><input type="password" id="lPw" autocomplete="current-password"></div>
      <div class="err" id="lErr"></div>
      <button class="btn primary" id="lBtn" style="width:100%">로그인</button>
      <button class="linkbtn" id="toGate">← 접근 코드 입력으로</button>
    </div>
  </section>

  <!-- VM -->
  <section class="view" id="v-list">
    <div id="seg1"></div>
    <div class="toolbar">
      <input class="search" id="q" type="search" placeholder="제목·담당자 검색">
      <select id="vSortSel" style="width:auto"></select>
      <button class="btn primary" id="newBtn">+ 새 Task</button>
    </div>
    <div class="cats" id="srcs"></div>
    <div class="cats" id="cats"></div>
    <div class="list" id="list"></div>
    <div class="toolbar" style="margin-top:14px"><div class="expbar" id="expVm"></div></div>
  </section>
  <section class="view" id="v-card"></section>
  <section class="view" id="v-edit">
    <div class="panel">
      <h2 id="editTitle">새 Task</h2>
      <div class="three">
        <div class="field"><label>일자</label>
          <div class="dline"><input type="date" class="dsm" id="fDate"><span class="wd" id="fWd"></span></div></div>
        <div class="field"><label>카테고리</label>
          <select id="fCat"><option>보고</option><option>제안</option><option>기획</option><option>R&amp;R</option></select></div>
        <div class="field"><label>현황</label>
          <select id="fStatus"><option>배정</option><option>진행</option><option>완료</option></select></div>
      </div>
      <div class="field"><label>제목 (Task name)</label><input type="text" id="fTitle" placeholder="예) 2027 SIC 헬프데스크 요원 안내문 배포"></div>
      <div class="field">
        <label>Work flow · 업무 프로세스와 단계별 담당자</label>
        <div id="steps"></div>
        <button class="btn sm" id="addStep">+ 단계 추가</button>
      </div>
      <div class="field"><label>작성자</label><select id="fAuthor" style="max-width:260px"></select></div>
      <div class="actions">
        <button class="btn primary" id="saveBtn">저장</button>
        <button class="btn" id="cancelBtn">취소</button>
      </div>
    </div>
  </section>

  <!-- VM 공유 -->
  <section class="view" id="v-share">
    <div id="seg2"></div>
    <div class="panel" id="dForm"></div>
    <div class="panel" id="shOut" style="margin-top:14px"></div>
  </section>

  <!-- RM / HL 공용 -->
  <section class="view" id="v-rmshare">
    <div id="seg3"></div>
    <div class="panel" id="rmForm"></div>
    <div class="panel" id="rmOut" style="margin-top:14px"></div>
  </section>
  <section class="view" id="v-rec">
    <div id="seg4"></div>
    <div class="toolbar">
      <input class="search" id="rq" type="search" placeholder="검색">
      <select id="rSortSel" class="hide" style="width:auto"></select>
      <button class="btn primary" id="rNew">+ 새로 등록</button>
    </div>
    <div class="list" id="rlist"></div>
    <div class="toolbar" style="margin-top:14px;flex-wrap:wrap"><div class="expbar" id="expRec"></div>
      <span class="impbar hide" id="rmImp"><button class="btn sm" id="rmUp">엑셀 업로드</button><button class="btn sm" id="rmSample">샘플 양식 다운로드</button><input type="file" id="rmFile" accept=".xlsx,.csv" hidden></span></div>
  </section>
  <section class="view" id="v-rmrep">
    <div id="seg5"></div>
    <div class="panel" id="rpForm"></div>
    <div class="panel" id="rpOut" style="margin-top:14px"></div>
  </section>
  <section class="view" id="v-recd"></section>
  <section class="view" id="v-rece"><div class="panel" id="rForm"></div></section>
  <datalist id="peopleList"></datalist>
  <datalist id="typeList"></datalist>
  <datalist id="catList"></datalist>

  <!-- OH -->
  <section class="view" id="v-oh"></section>

  <!-- 설정 -->
  <section class="view" id="v-set">  </section>

  <section class="view" id="v-acc">  </section>

  <section class="view" id="v-tpl">  </section>

  <section class="view" id="v-note">  </section>
</div>

<div class="overlay" id="pwOv">
  <div class="modal">
    <h2 id="pwTitle">비밀번호 변경</h2>
    <p class="hint" id="pwHint"></p>
    <div class="field" id="pwCurWrap"><label>현재 비밀번호</label><input type="password" id="pwCur" autocomplete="current-password"></div>
    <div class="field"><label>새 비밀번호 (4자 이상, 1234 불가)</label><input type="password" id="pwNew" autocomplete="new-password"></div>
    <div class="field"><label>새 비밀번호 확인</label><input type="password" id="pwNew2" autocomplete="new-password"></div>
    <div class="err" id="pwErr"></div>
    <div class="actions" style="margin-top:4px">
      <button class="btn primary" id="pwSave">변경</button>
      <button class="btn" id="pwCancel">취소</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

function fmtDT(ms){ if(!ms) return '변경 이력 없음'; const d=new Date(ms), p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'.'+p(d.getMonth()+1)+'.'+p(d.getDate())+' ('+WD[d.getDay()]+') '+p(d.getHours())+':'+p(d.getMinutes()); }

function owners(t){ return [...new Set(t.steps.map(s=>s.owner).filter(Boolean))]; }

/* ---------- date ---------- */
function parseD(s){ const [y,m,d]=String(s).split('-').map(Number); return new Date(y,(m||1)-1,d||1); }
function wdOf(s){ return WD[parseD(s).getDay()]; }
function wdCls(s){ const g=parseD(s).getDay(); return g===0?'sun':g===6?'sat':''; }
function fmtShort(s){ return s.slice(2).replace(/-/g,'.'); }
function fmtText(s){ return s ? s+' ('+wdOf(s)+')' : ''; }

const _KEY='tm-access-v1';
function _ks(key){ let h=2166136261>>>0; for(let i=0;i<key.length;i++){ h^=key.charCodeAt(i); h=Math.imul(h,16777619)>>>0; }
  return function(){ h=(h+0x6D2B79F5)>>>0; let t=h; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)&255; }; }
function _dec(b64,key){ const bin=atob(b64), n=new Uint8Array(bin.length), r=_ks(key); for(let i=0;i<bin.length;i++) n[i]=bin.charCodeAt(i)^r(); return new TextDecoder().decode(n); }
let S = null, ACCESS = null;
const ENV = { S:()=>S, save:()=>save(), toast:m=>toast(m), esc };
try{ ACCESS = new Function('env', _dec(_BLOB,_KEY))(ENV); }catch(e){ console.error('access module', e); }

/* ---------- state ---------- */
function defaultUsers(){
  return [
    { id:'admin',   role:'admin',   pwh:null, must:true, perms:{} },
    { id:'manager', role:'manager', pwh:null, must:true, perms:{...DEFAULT_PERMS} }
  ];
}
function normalize(d){
  d = d && typeof d==='object' ? d : {};
  ['tasks','tickets','hl','people'].forEach(k=>{ if(!Array.isArray(d[k])) d[k]=[]; });
  if(Array.isArray(d.docs)) d.docs.forEach(x=>{ if(x&&x.id&&!d.tasks.some(t=>t.id===x.id)){ const doc={ head:x.head, tf:x.tf||'', content:x.content||'', flow:x.flow||[], rr:x.rr||[] }; if(typeof x.final==='string') doc.final=x.final;
      d.tasks.push({ id:x.id, date:x.date, cat:x.head, title:x.title, status:'배정', steps:[], created:x.created||Date.now(), doc }); } });
  delete d.docs;
  d.tasks.forEach(t=>{ if(!t.cat) t.cat='보고'; if(!Array.isArray(t.steps)) t.steps=[]; });
  d.lastChanged = typeof d.lastChanged==='number' ? d.lastChanged : null;
  if(!Array.isArray(d.rmCats)) d.rmCats=[];
  if(!Array.isArray(d.oh)) d.oh=[];
  d.oh.forEach(x=>{ if(!Array.isArray(x.attach)) x.attach=[]; if(!x.src) x.src='Task'; if(!x.created) x.created=Date.now(); });
  if(!Array.isArray(d.bodyTpls)) d.bodyTpls=[];
  d.authors=[...new Set([...(Array.isArray(d.authors)?d.authors:[]),...d.tasks.map(t=>t.author)].filter(Boolean))];
  d.tickets.forEach(t=>{ if(t.status==='배정') t.status='진행'; else if(t.status==='답변') t.status='협업진행'; if(typeof t.cat!=='string') t.cat=''; if(!t.inDate) t.inDate = t.created ? ymd(t.created) : t.date; if(typeof t.reply!=='string') t.reply=''; });
  if(!Array.isArray(d.users)||!d.users.length) d.users=defaultUsers();
  if(!d.users.some(u=>u.role==='admin')) d.users.unshift(defaultUsers()[0]);
  d.users.forEach(u=>{ if(u.role==='manager'){ const o=u.perms||{}; u.perms={}; Object.keys(PERM_LABELS).forEach(k=>u.perms[k]= o[k]!==undefined && k in o ? !!o[k] : DEFAULT_PERMS[k]); } });
  d.fmt = Object.assign({text:true,image:true,share:true}, d.fmt||{});
  d.opts = Object.assign({tf:true}, d.opts||{});
  if(!Array.isArray(d.tfs)) d.tfs=[];
  { const dt=DEF_TPL(), t=d.tpl||{};
    d.tpl={ docShare:Object.assign(dt.docShare,t.docShare||{}),
            rm:typeof t.rm==='string'?t.rm:dt.rm, hl:typeof t.hl==='string'?t.hl:dt.hl, oh:typeof t.oh==='string'?t.oh:dt.oh };
    Object.keys(d.tpl.docShare).forEach(h=>{ const v=d.tpl.docShare[h]; if(v===OLD_SHARE||v===OLD_RR_SHARE||v===OLD3_SHARE||v===OLD3_RR_SHARE) d.tpl.docShare[h]=DEF_TPL().docShare[h]; });
    if(d.tpl.rm===OLD_RM||d.tpl.rm===OLD_RM2) d.tpl.rm=DEF_TPL().rm; }
  const out=[];
  (Array.isArray(d.pages)?d.pages:[]).forEach(p=>{ if(PAGE_DEF[p.id] && !out.some(o=>o.id===p.id)) out.push({id:p.id,label:p.label||PAGE_DEF[p.id].label,on:p.on!==false,out:Array.isArray(p.out)?p.out.filter(x=>ALL_OUT.includes(x)):ALL_OUT.slice()}); });
  Object.keys(PAGE_DEF).forEach(id=>{ if(!out.some(o=>o.id===id)) out.push({id,label:PAGE_DEF[id].label,on:true,out:ALL_OUT.slice()}); });
  d.pages=out;
  if(ACCESS) ACCESS.ensure(d);
  return d;

  catch(e){ const a=document.createElement('textarea'); a.value=txt; document.body.appendChild(a); a.select(); let ok=false; try{ok=document.execCommand('copy');}catch(_){} a.remove(); return ok; }
}
function canvasBlob(c){ return new Promise(r=>c.toBlob(r,'image/png')); }
function getAuthor(){ try{ return localStorage.getItem('tm_author')||''; }catch(e){ return ''; } }
function setAuthor(v){ try{ localStorage.setItem('tm_author',v); }catch(e){} }
let IMGOPT=(()=>{ try{ return localStorage.getItem('tm_img')==='1'; }catch(e){ return false; } })();
document.body.classList.toggle('img-on',IMGOPT);
document.addEventListener('change',e=>{
  const c=e.target; if(!c.classList||!c.classList.contains('imgcb')) return;
  IMGOPT=c.checked; try{ localStorage.setItem('tm_img',IMGOPT?'1':'0'); }catch(_){}
  document.body.classList.toggle('img-on',IMGOPT); document.querySelectorAll('.imgcb').forEach(x=>x.checked=IMGOPT);
});
function shareBarHtml(right){
  const f=S.fmt; const b=[];
  if(f.text) b.push('<button class="btn primary" id="shText">텍스트 복사</button>');
  if(f.image) b.push('<button class="btn imgonly" id="shImg">이미지 저장</button>');
  if(f.share) b.push('<button class="btn" id="shShare">공유</button>');
  if(f.image) b.push(`<label class="imgopt"><input type="checkbox" class="imgcb" ${IMGOPT?'checked':''}> 이미지 포함 (옵션)</label>`);
  return (b.length||right)?`<div class="sharebar">${b.join('')}${right?`<span class="push">${right}</span>`:''}</div>`:'';
}
async function doShare(kind, o){   // o:{text, canvas(), name, title, note}  → 성공 여부 반환
  const n=o.note?' · '+o.note:'';
  if(kind==='shText'){ const ok=await copyText(o.text); toast((ok?'텍스트를 복사했습니다':'복사에 실패했습니다')+n); return ok; }
  else if(kind==='shImg'){ download(await canvasBlob(o.canvas()), o.name); toast('이미지를 저장했습니다'+n); return true; }
  else if(kind==='shShare'){
    try{
      let files=null;
      if(S.fmt.image && IMGOPT){ const blob=await canvasBlob(o.canvas()); const file=new File([blob],o.name,{type:'image/png'}); if(navigator.canShare && navigator.canShare({files:[file]})) files=[file]; }
      if(navigator.share){ await navigator.share(files?{title:o.title,text:o.text,files}:{title:o.title,text:o.text}); if(o.note) toast(o.note); return true; }
      const ok=await copyText(o.text); toast((ok?'공유 미지원 환경: 텍스트를 복사했습니다':'공유할 수 없습니다')+n); return ok;
    }catch(err){ if(err && err.name!=='AbortError') toast('공유에 실패했습니다'); return false; }
  }
  return false;
}

/* ---------- canvas ---------- */
const FONT='"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function wrap(ctx,text,max){
  const out=[]; let line='';
  for(const ch of String(text)){
    if(ch==='\n'){out.push(line);line='';continue;}
    const test=line+ch;
    if(ctx.measureText(test).width>max && line){out.push(line);line=ch;} else line=test;
  }
  out.push(line); return out;
}
function drawCard(t){
  const F=FONT, W=760, pad=32, inner=W-pad*2, scale=2;
  const m=document.createElement('canvas').getContext('2d');
  m.font=`700 28px ${F}`; const tl=wrap(m,t.title,inner);
  m.font=`600 18px ${F}`;
  const boxes=t.steps.map(s=>{ const ls=wrap(m,s.name||'(단계명 없음)',inner-130); return {s,ls,h:Math.max(60,ls.length*26+22)}; });
  let H=pad+26+10+tl.length*38+8+24+20+22+16+ (boxes.length? boxes.reduce((a,b)=>a+b.h,0)+(boxes.length-1)*30 : 30) +pad+22;
  const c=document.createElement('canvas'); c.width=W*scale; c.height=H*scale;
  const x=c.getContext('2d'); x.scale(scale,scale);
  x.fillStyle='#f4f6fa'; x.fillRect(0,0,W,H);
  x.fillStyle='#fff'; rr(x,12,12,W-24,H-24,18); x.fill(); x.strokeStyle='#e2e6ee'; x.lineWidth=1; x.stroke();
  let y=pad+10; x.textBaseline='alphabetic';
  const si=STATUS.indexOf(t.status), sc=['#d9822b','#2f7de1','#2e9e6a'][si], sbg=['#fff1e0','#e3efff','#e0f5ec'][si];
  x.font=`600 14px ${F}`; x.fillStyle='#6b7488'; x.fillText('📅 '+fmtText(t.date)+'   ['+(t.cat||'보고')+']', pad, y+14);
  const bw=x.measureText(t.status).width+24; x.fillStyle=sbg; rr(x,W-pad-bw,y-6,bw,26,13); x.fill();
  x.fillStyle=sc; x.fillText(t.status, W-pad-bw+12, y+13);
  y+=26+10; x.font=`700 28px ${F}`; x.fillStyle='#1c2333';
  tl.forEach(l=>{ y+=32; x.fillText(l,pad,y); y+=6; });
  y+=8; x.font=`500 15px ${F}`; x.fillStyle='#6b7488';
  const o=owners(t); x.fillText('담당자: '+(o.length?o.join(', '):'-'), pad, y+16); y+=24;
  const done=t.steps.filter(s=>s.done).length, n=t.steps.length, pct=n?done/n:0;
  y+=8; x.fillStyle='#e2e6ee'; rr(x,pad,y,inner,6,3); x.fill();
  if(pct>0){ x.fillStyle='#2e9e6a'; rr(x,pad,y,Math.max(6,inner*pct),6,3); x.fill(); }
  y+=22; x.font=`500 13px ${F}`; x.fillStyle='#6b7488'; x.fillText(`진행 ${done}/${n} 단계`, pad, y); y+=16;
  if(!boxes.length){ x.font=`500 15px ${F}`; x.fillText('기록된 Work flow 없음', pad, y+20); y+=30; }
  boxes.forEach((b,i)=>{
    if(i){ x.fillStyle='#aab2c5'; x.font=`400 18px ${F}`; x.textAlign='center'; x.fillText('↓', W/2, y+21); x.textAlign='left'; y+=30; }
    x.fillStyle=b.s.done?'#f3fbf7':'#fff'; rr(x,pad,y,inner,b.h,12); x.fill();
    x.strokeStyle=b.s.done?'#cdeedd':'#e2e6ee'; x.stroke();
    x.fillStyle=b.s.done?'#2e9e6a':'#3b5bdb'; x.beginPath(); x.arc(pad+28,y+b.h/2,14,0,Math.PI*2); x.fill();
    x.fillStyle='#fff'; x.font=`700 14px ${F}`; x.textAlign='center'; x.fillText(String(i+1), pad+28, y+b.h/2+5); x.textAlign='left';
    x.font=`600 18px ${F}`; x.fillStyle=b.s.done?'#6b7488':'#1c2333';
    const ty=y+b.h/2-(b.ls.length-1)*13+6;
    b.ls.forEach((l,k)=>x.fillText(l,pad+54,ty+k*26));
    const ow=b.s.owner||'미지정'; x.font=`600 14px ${F}`; const ww=x.measureText(ow).width+22;
    x.fillStyle=b.s.owner?'#e8edff':'#eef0f4'; rr(x,pad+inner-ww-12,y+b.h/2-13,ww,26,13); x.fill();
    x.fillStyle=b.s.owner?'#3b5bdb':'#6b7488'; x.fillText(ow,pad+inner-ww-1,y+b.h/2+5);
    y+=b.h;
  });
  x.font=`400 11px ${F}`; x.fillStyle='#aab2c5'; x.textAlign='right'; x.fillText('Task Manager v'+VERSION, W-pad, H-pad+6);
  return c;
}
function drawGeneric(tag,title,metas,body){
  const F=FONT, W=760, pad=32, inner=W-pad*2, scale=2;
  const m=document.createElement('canvas').getContext('2d');
  m.font=`700 26px ${F}`; const tl=title?wrap(m,title,inner):[];
  m.font=`400 16px ${F}`; const bl=body?wrap(m,body,inner-28):[];
  const H=pad+24+14+tl.length*36+14+metas.length*28+(bl.length?bl.length*24+48:0)+pad+16;
  const c=document.createElement('canvas'); c.width=W*scale; c.height=H*scale;
  const x=c.getContext('2d'); x.scale(scale,scale);
  x.fillStyle='#f4f6fa'; x.fillRect(0,0,W,H);
  x.fillStyle='#fff'; rr(x,12,12,W-24,H-24,18); x.fill(); x.strokeStyle='#e2e6ee'; x.stroke();
  let y=pad+8; x.font=`700 14px ${F}`; x.fillStyle='#3b5bdb'; x.fillText(tag,pad,y+14); y+=24+14;
  x.font=`700 26px ${F}`; x.fillStyle='#1c2333'; tl.forEach(l=>{ y+=30; x.fillText(l,pad,y); y+=6; });
  y+=14; metas.forEach(([k,v])=>{ x.font=`600 14px ${F}`; x.fillStyle='#6b7488'; x.fillText(k,pad,y+14); x.font=`500 15px ${F}`; x.fillStyle='#1c2333'; x.fillText(String(v||'-'),pad+96,y+14); y+=28; });
  if(bl.length){ y+=10; const bh=bl.length*24+24; x.fillStyle='#fafbfd'; rr(x,pad,y,inner,bh,10); x.fill(); x.strokeStyle='#e2e6ee'; x.stroke();
    x.font=`400 16px ${F}`; x.fillStyle='#1c2333'; bl.forEach((l,i)=>x.fillText(l,pad+14,y+28+i*24)); }
  x.font=`400 11px ${F}`; x.fillStyle='#aab2c5'; x.textAlign='right'; x.fillText('Task Manager v'+VERSION, W-pad, H-pad+8);
  return c;
}

/* ---------- R&R 헬퍼 / 이미지 ---------- */
const NAME_COLORS=[['#e3ebff','#2f49b0'],['#ffe3e8','#c2304a'],['#dcf4e8','#1c8a58'],['#ffeacc','#b86512'],['#f0e4fc','#7a3fc4'],['#d9f1f6','#0f7f94'],['#fcefc2','#8c6a00'],['#fde0f2','#b02a80'],['#e6f2d3','#47820f'],['#e6e8f0','#454e63']];
const splitNames = s => String(s||'').split(/[,，、\/·]+/).map(t=>t.trim()).filter(Boolean);
function nameMap(x){ const m=new Map(); (x.rr||[]).forEach(r=>splitNames(r.owner).forEach(n=>{ if(!m.has(n)) m.set(n,NAME_COLORS[m.size%NAME_COLORS.length]); })); return m; }
const flowText = x => (x.flow||[]).map(s=>s.name).filter(Boolean).join(' → ');
const rrTable = x => (x.rr||[]).filter(r=>r.task||r.owner||r.follow).map((r,i)=>`${i+1}) ${r.task||'-'} | 담당: ${r.owner||'-'} | Follow-up: ${r.follow||'-'}`).join('\n');
function docContentText(x){ if(x.head!=='R&R') return x.content||''; return '[Work flow] '+flowText(x)+'\n[R&R]\n'+rrTable(x)+(x.content?'\n[비고] '+x.content:''); }
function rrHtml(x){
  const cm=nameMap(x), col=n=>cm.get(n)||['#eef0f4','#454e63'];
  const chip=n=>`<span class="nchip" style="background:${col(n)[0]};color:${col(n)[1]}">${esc(n)}</span>`;
  const fl=(x.flow||[]).length ? `<div class="rrflow">${x.flow.map((s,i)=>`${i?'<span class="farr">→</span>':''}<span class="fbox"><b>${i+1}</b>${esc(s.name)}</span>`).join('')}</div>` : '<div class="hint">입력된 Work flow가 없습니다.</div>';

    <div class="toolbar"><input class="search" id="oq" type="search" placeholder="제목·발송대상 검색" value="${esc(OHQ)}">
      <select id="oSortSel" style="width:auto">${OHSORT_OPTS.map(([k,l])=>`<option value="${k}:1">${l} ↑</option><option value="${k}:-1">${l} ↓</option>`).join('')}</select>
      <button class="btn primary" id="oNew">+ 새 Task</button></div>
    <div class="cats"><span class="explbl">구분</span>${['전체','공유','Task'].map(c=>`<button class="chip ${OHF.src===c?'on':''}" data-osrc="${c}">${c}<b>${c==='전체'?S.oh.length:cnt(x=>x.src===c)}</b></button>`).join('')}</div>
    <div class="cats">${['전체',...OH_HEADS].map(c=>`<button class="chip ${OHF.head===c?'on':''}" data-ohf="${c}">${c}<b>${c==='전체'?S.oh.length:cnt(x=>x.head===c)}</b></button>`).join('')}</div>
    <div class="list" id="ohList">${ohListHtml()}</div>
    <div class="toolbar" style="margin-top:14px"><div class="expbar" id="expOh"></div></div>`;
  $('oSortSel').value=OHSORT.k+':'+OHSORT.d; renderExp('oh',$('expOh'));
}
function renderOhCard(){
  const x=S.oh.find(r=>r.id===ohCur); if(!x){ ohMode='list'; renderOhList(); return; }
  const mail=x.head==='서신발송';
  $('v-oh').innerHTML=`${ohSeg()}<div class="toolbar"><button class="btn sm" id="oBack">← 목록</button><span style="flex:1"></span><button class="btn sm" id="oEdit">수정</button><button class="btn sm danger" id="oDel">삭제</button></div>
    <div class="card"><div class="meta">${fmtHtml(x.date,true)}<span class="cat">${esc(x.head)}</span><span class="cat ${x.src==='공유'?'share':'task'}">${x.src}</span></div>
      <h2>${esc(x.title)}</h2>
      <dl class="kv"><dt>${mail?'발송대상':'대상자'}</dt><dd>${esc(x.target||'-')}</dd></dl>
      <div class="body">${esc(x.content||'(내용 없음)')}</div>

}
function renderOhEdit(){
  const e=ohDraft;
  $('v-oh').innerHTML=`${ohSeg()}<div class="panel"><h2>${e.id?'Task 수정':'새 Task'}</h2>
    <div class="field"><label>머리말</label><select id="oHead" style="max-width:220px">${OH_HEADS.map(h=>`<option ${h===e.head?'selected':''}>${h}</option>`).join('')}</select></div>

function ohShareArgs(x,text){
  return { text, canvas:()=>drawGeneric('OH · '+x.head,x.title,[[x.head==='서신발송'?'발송대상':'대상자',x.target],['일자',fmtText(x.date)]],(x.content||'')+((x.attach||[]).length?'\n\n첨부: '+x.attach.map(a=>a.name).join(', '):'')), name:safeName(x.title||'oh',x.date), title:x.title };
}
$('v-oh').oninput=e=>{
  const t=e.target;
  if(t.id==='oq'){ OHQ=t.value; $('ohList').innerHTML=ohListHtml(); return; }
  const st=ohSt(); if(!st) return;
  if(t.id==='oFinal'){ ohManual=true; st.final=t.value; $('oMod').classList.remove('hide'); return; }
  if(t.id==='oDate'){ st.date=t.value; updOhWd(); }
  else if(t.id==='oTarget') st.target=t.value;
  else if(t.id==='oTitle') st.title=t.value;
  else if(t.id==='oContent') st.content=t.value;
  else return;
  ohSync();
};
$('v-oh').onchange=e=>{
  const t=e.target, st=ohSt();
  if(t.id==='oSortSel'){ const [k,d]=t.value.split(':'); OHSORT={k,d:+d}; renderOhList(); return; }
  if(!st) return;
  if(t.id==='oDate'){ st.date=t.value; updOhWd(); ohSync(); }
  else if(t.id==='oHead'){ st.head=t.value; renderOhEdit(); }
  else if(t.id==='oFile'){ const f=t.files; ohReadFiles(f,st.attach,()=>{ $('oAtt').innerHTML=attHtml(st.attach,true); ohSync(); }); t.value=''; }
};
$('v-oh').onclick=e=>{
  const t=e.target;
  const sg=t.closest('[data-oseg]');
  if(sg){ const to=sg.dataset.oseg; if(to===OHTAB) return; OHTAB=to; ohMode='list'; ohDraft=null; renderOh(); return; }
  const rowEl=t.closest('[data-oid]'); const srt=t.closest('[data-osort]');
  if(srt){ const k=srt.dataset.osort; if(OHSORT.k===k) OHSORT.d*=-1; else OHSORT={k,d:k==='date'?-1:1}; renderOhList(); return; }
  const sc=t.closest('[data-osrc]'); if(sc){ OHF.src=sc.dataset.osrc; renderOhList(); return; }
  const hc=t.closest('[data-ohf]'); if(hc){ OHF.head=hc.dataset.ohf; renderOhList(); return; }
  if(rowEl){ ohCur=rowEl.dataset.oid; ohMode='card'; renderOh(); return; }
  const ad=t.closest('[data-oatt-del]'); if(ad){ const st=ohSt(); if(st){ st.attach.splice(+ad.dataset.oattDel,1); $('oAtt').innerHTML=attHtml(st.attach,true); ohSync(); } return; }
  const b=t.closest('button'); if(!b) return; const id=b.id;
  if(id==='oNew'){ ohDraft={ id:null, head:'서신발송', date:todayStr(), target:'', title:'', content:'', attach:[], src:'Task' }; ohMode='edit'; renderOh(); }
  else if(id==='oBack'){ ohMode='list'; renderOh(); }
  else if(id==='oEdit'){ const x=S.oh.find(r=>r.id===ohCur); if(!x) return; ohDraft=JSON.parse(JSON.stringify(x)); ohMode='edit'; renderOh(); }
  else if(id==='oDel'){ if(confirm('삭제할까요?')){ S.oh=S.oh.filter(r=>r.id!==ohCur); if(ohEdit&&ohEdit.id===ohCur) ohEdit=null; save(); ohMode='list'; renderOh(); toast('삭제되었습니다'); } }
  else if(id==='oECancel'){ ohMode=ohDraft&&ohDraft.id?'card':'list'; ohDraft=null; renderOh(); }
  else if(id==='oESave'){
    const d=ohDraft, title=d.title.trim(), target=d.target.trim();
    if(d.head==='서신발송' && !target){ toast('발송대상을 입력하세요'); $('oTarget').focus(); return; }
    if(!title){ toast('제목을 입력하세요'); $('oTitle').focus(); return; }
    const rec={ head:d.head, date:d.date||todayStr(), target, title, content:d.content, attach:d.attach.slice() };
    let x=d.id?S.oh.find(r=>r.id===d.id):null;
    if(x){ Object.assign(x,rec); delete x.final; } else { x=Object.assign({ id:uid(), src:'Task', created:Date.now() },rec); S.oh.push(x); }
    save(); ohCur=x.id; ohMode='card'; ohDraft=null; renderOh(); toast('저장되었습니다');
  }
  else if(id==='oFinalReset'){ ohManual=false; ohEdit.final=undefined; renderOhOut(); toast('틀대로 다시 만들었습니다'); }
  else if(id==='oCancel'){ const cid=ohEdit.id; ohEdit=null; ohManual=false; OHTAB='task'; ohMode='card'; ohCur=cid; renderOh(); }
  else if(id==='oSave'){
    const x=ohPersist(); if(!x) return;
    ohEdit=null; ohManual=false; OHTAB='task'; ohMode='list'; OHF={head:'전체',src:'전체'}; OHQ=''; renderOh(); toast('Task에 저장되었습니다');
    setTimeout(()=>{ const r=document.querySelector(`#ohList [data-oid="${x.id}"]`); if(r){ r.classList.add('flash'); r.scrollIntoView({block:'center'}); } },30);
  }
  else if(['shText','shImg','shShare'].includes(id)){
    if(OHTAB==='share'){
      const isNew=!ohEdit.id, x=ohPersist(); if(!x) return;
      if(isNew){ const sv=$('oSave'); if(sv) sv.textContent='수정 내용 저장 → Task'; }
      doShare(id,Object.assign(ohShareArgs(x,$('oFinal').value),{ note:'Task에 자동 저장됨' }));
    } else if(ohMode==='card'){
      const x=S.oh.find(r=>r.id===ohCur); if(x) doShare(id,ohShareArgs(x,$('oCardFinal').value));
    }
  }
};

/* ---------- events ---------- */
$('verBadge').textContent='v'+VERSION; document.title='VM Task Manager v'+VERSION;
$('today').innerHTML='오늘 '+fmtHtml(todayStr(),true);
$('gBtn').onclick=doGate; $('gCode').onkeydown=e=>{ if(e.key==='Enter') doGate(); };
$('gearBtn').onclick=()=>navigate('set'); $('setHome').onclick=$('toGate').onclick=()=>{ if(SES&&allowedPages()[0]) navigate(allowedPages()[0].id); else { PG=null; renderNav(); show('gate'); } };
$('lBtn').onclick=doLogin; $('lPw').onkeydown=e=>{ if(e.key==='Enter') doLogin(); }; $('lId').onkeydown=e=>{ if(e.key==='Enter') $('lPw').focus(); };
$('outBtn').onclick=logout; $('pwBtn').onclick=()=>openPw(false); $('pwSave').onclick=savePw;
$('pwCancel').onclick=()=>$('pwOv').classList.remove('on');
['pwCur','pwNew','pwNew2'].forEach(i=>$(i).onkeydown=e=>{ if(e.key==='Enter') savePw(); });

$('menu').onclick=e=>{ const b=e.target.closest('[data-p]'); if(!b) return; if(b.dataset.p==='rm' && PG!=='rm') RMTAB='share'; if(b.dataset.p==='oh' && PG!=='oh'){ OHTAB='share'; ohMode='list'; } navigate(b.dataset.p); };
$('tabs').onclick=e=>{ const b=e.target.closest('[data-f]'); if(!b) return; FS[PG]=b.dataset.f; navigate(PG); };

/* VM */
$('newBtn').onclick=()=>openEdit(); $('q').oninput=renderList;
$('cats').onclick=e=>{ const b=e.target.closest('[data-cat]'); if(b){ CATF=b.dataset.cat; renderList(); } };
$('list').onclick=e=>{
  const h=e.target.closest('[data-vsort]');
  if(h){ const k=h.dataset.vsort; if(VSORT.k===k) VSORT.d*=-1; else VSORT={k,d:k==='date'?-1:1}; renderList(); return; }
  const r=e.target.closest('[data-id]'); if(r) openCard(r.dataset.id);
};
$('vSortSel').onchange=e=>{ const [k,d]=e.target.value.split(':'); VSORT={k,d:+d}; renderList(); };
$('srcs').onclick=e=>{ const b=e.target.closest('[data-src]'); if(b){ SRCF=b.dataset.src; renderList(); } };
function vmShareObj(t){
  if(t.doc){ const v=docView(t), text=$('cFinal').value;
    return { text, canvas:()=> t.doc.head==='R&R' ? drawRR(cleanView(v)) : drawGeneric(t.doc.head+' 공유','',[],text), name:safeName(t.title,t.date), title:t.title }; }
  return { text:vmText(t), canvas:()=>drawCard(t), name:safeName(t.title,t.date), title:t.title };
}
$('v-card').onclick=async e=>{
  const t=S.tasks.find(x=>x.id===cur); if(!t) return; const id=e.target.id;
  if(id==='cBack'){ renderList(); show('list'); }
  else if(id==='cEdit'){ if(t.doc) openShareEdit(cur); else openEdit(cur); }
  else if(id==='cSteps') openEdit(cur);
  else if(id==='cFinalSave'){ t.doc.final=$('cFinal').value; save(); renderCard(); toast('수정한 공유 텍스트를 저장했습니다'); }
  else if(id==='cFinalReset'){ delete t.doc.final; save(); renderCard(); toast('틀대로 다시 만들었습니다'); }
  else if(id==='cDel'){ if(confirm('이 Task를 삭제할까요?')){ S.tasks=S.tasks.filter(x=>x.id!==cur); save(); renderList(); show('list'); toast('삭제되었습니다'); } }
  else if(['shText','shImg','shShare'].includes(id)) doShare(id,vmShareObj(t));
  else if(e.target.dataset.step){
    const s=t.steps.find(x=>x.id===e.target.dataset.step);
    if(s){ s.done=e.target.checked;
      if(t.steps.length && t.steps.every(x=>x.done)) t.status='완료';
      else if(t.status==='완료') t.status='진행';
      else if(t.status==='배정' && s.done) t.status='진행';
      save(); renderCard(); }
  }
};
$('v-card').onchange=e=>{ if(e.target.id==='cStatus'){ const t=S.tasks.find(x=>x.id===cur); t.status=e.target.value; save(); renderCard(); } };
$('fDate').onchange=updWd; $('fDate').oninput=updWd;
$('addStep').onclick=()=>{ draft.steps.push({id:uid(),name:'',owner:'',done:false}); renderSteps(); const n=$('steps').querySelectorAll('.nm'); n[n.length-1].focus(); };
$('steps').oninput=e=>{ const row=e.target.closest('.stepedit'); if(row&&e.target.dataset.k) draft.steps[+row.dataset.i][e.target.dataset.k]=e.target.value; };
$('steps').onclick=e=>{
  const b=e.target.closest('[data-act]'); if(!b) return; const i=+b.closest('.stepedit').dataset.i, a=b.dataset.act, st=draft.steps;
  if(a==='del') st.splice(i,1);
  else if(a==='up'&&i>0) [st[i-1],st[i]]=[st[i],st[i-1]];
  else if(a==='down'&&i<st.length-1) [st[i+1],st[i]]=[st[i],st[i+1]];
  renderSteps();
};
$('fAuthor').onchange=e=>{
  const t=e.target; if(t.value!=='__new') return;
  const n=(prompt('새 작성자 이름')||'').trim();
  if(n){ if(!S.authors.includes(n)) S.authors.push(n); save(); draft.author=n; t.innerHTML=authorOptions(n); } else t.innerHTML=authorOptions(draft.author||'');

async function inflateRaw(u8){ const ds=new DecompressionStream('deflate-raw'); const w=ds.writable.getWriter(); w.write(u8); w.close(); return new Uint8Array(await new Response(ds.readable).arrayBuffer()); }
async function unzip(buf){
  const u=new Uint8Array(buf), dv=new DataView(buf), dec=new TextDecoder(); let e=u.length-22;
  while(e>=0 && dv.getUint32(e,true)!==0x06054b50) e--; if(e<0) throw new Error('zip');
  const n=dv.getUint16(e+10,true); let p=dv.getUint32(e+16,true); const files={};
  for(let i=0;i<n;i++){
    const method=dv.getUint16(p+10,true), csz=dv.getUint32(p+20,true), nl=dv.getUint16(p+28,true), el=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true), off=dv.getUint32(p+42,true);
    const name=dec.decode(u.subarray(p+46,p+46+nl)); p+=46+nl+el+cl;
    const start=off+30+dv.getUint16(off+26,true)+dv.getUint16(off+28,true), data=u.subarray(start,start+csz);
    files[name]= method===0 ? data : method===8 ? await inflateRaw(data) : null;
  }
  return files;
}
function colIdx(ref){ let n=0; for(const ch of ref.replace(/[0-9]/g,'')) n=n*26+ch.charCodeAt(0)-64; return n-1; }
function parseXlsx(files){
  const dec=new TextDecoder(), xml=k=>new DOMParser().parseFromString(dec.decode(files[k]),'application/xml');
  const ss=[]; if(files['xl/sharedStrings.xml']) xml('xl/sharedStrings.xml').querySelectorAll('si').forEach(si=>ss.push([...si.querySelectorAll('t')].filter(t=>!t.closest('rPh')).map(t=>t.textContent).join('')));
  const sk=Object.keys(files).filter(k=>/^xl\/worksheets\/sheet\d+\.xml$/.test(k)).sort((a,b)=>parseInt(a.match(/\d+/)[0])-parseInt(b.match(/\d+/)[0]))[0];
  if(!sk) throw new Error('sheet');
  const rows=[];
  xml(sk).querySelectorAll('row').forEach(r=>{
    const arr=[]; r.querySelectorAll('c').forEach(c=>{
      const i=colIdx(c.getAttribute('r')||''), t=c.getAttribute('t'), v=c.querySelector('v');
      let val=''; if(t==='s') val=ss[+(v&&v.textContent)]||''; else if(t==='inlineStr') val=[...c.querySelectorAll('t')].map(x=>x.textContent).join(''); else if(v) val=v.textContent;
      arr[i]=val;
    });

  });

}
function parseCsv(t){
  t=t.replace(/^\uFEFF/,''); const rows=[]; let row=[],cur='',q=false;
  for(let i=0;i<t.length;i++){ const ch=t[i];
    if(q){ if(ch==='"'){ if(t[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=ch; }
    else if(ch==='"') q=true; else if(ch===','){ row.push(cur); cur=''; }
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&t[i+1]==='\n') i++; row.push(cur); rows.push(row); row=[]; cur=''; }
    else cur+=ch; }
  if(cur||row.length){ row.push(cur); rows.push(row); }
  return rows;
}
function toDateStr(v){
  v=String(v==null?'':v).trim(); if(!v) return '';
  if(/^\d+(\.\d+)?$/.test(v) && +v>20000){ const d=new Date(Math.round((+v-25569)*86400000)); return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0'); }
  const m=v.match(/(\d{2,4})\D+(\d{1,2})\D+(\d{1,2})/); if(!m) return '';
  const y=m[1].length===2?2000+ +m[1]:+m[1]; return y+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0');
}
function importTickets(rows){
  const norm=h=>String(h||'').replace(/[\s#]/g,'').toLowerCase();
  const ALI={no:['taskno','티켓no','티켓id','티켓번호','no','id'],date:['접수일자','배정일자','일자'],cat:['분류','카테고리'],owner:['담당자'],title:['제목'],content:['내용'],reply:['답변'],status:['처리현황','상태','현황'],inDate:['입력일자']};
  const hr=rows.findIndex(r=>r&&r.some(x=>String(x||'').trim())); if(hr<0) return {err:'빈 파일입니다'};
  const H=rows[hr].map(norm), idx={}; Object.keys(ALI).forEach(k=>{ const i=H.findIndex(h=>ALI[k].includes(h)); if(i>=0) idx[k]=i; });
  if(idx.no===undefined||idx.title===undefined) return {err:'“Task No”, “제목” 열이 필요합니다. 샘플 양식을 확인하세요'};
  const get=(r,k)=>idx[k]===undefined?'':String(r[idx[k]]==null?'':r[idx[k]]).trim();
  let ok=0, dup=0, miss=0; const seen=new Set(S.tickets.map(t=>t.no)), now=Date.now();
  rows.slice(hr+1).forEach((r,i)=>{
    if(!r||!r.some(x=>String(x||'').trim())) return;
    const no=normNo(get(r,'no')), title=get(r,'title');

    if(seen.has(no)){ dup++; return; }
    seen.add(no);
    const reply=get(r,'reply'); let st=get(r,'status'); st=({'배정':'진행','답변':'협업진행'})[st]||st; if(!REC.rm.statuses.includes(st)) st=reply?'완료':'접수';
    const date=toDateStr(get(r,'date')), cat=get(r,'cat'), owner=get(r,'owner');
    S.tickets.push({ id:uid(), created:now+i, no, date, inDate:toDateStr(get(r,'inDate'))||todayStr(), title, content:get(r,'content'), cat, owner, status:st, reply, replyAt:reply?now:null });
    if(cat && !S.rmCats.includes(cat)) S.rmCats.push(cat); addPeople([owner]); ok++;
  });
  if(ok) save();
  return {ok,dup,miss};
}

let RP={ from:'', to:'', owner:'', cat:'', list:'open' };
const STC={ '접수':'#d9822b','진행':'#2f7de1','협업진행':'#8b5cd6','완료':'#2e9e6a' };
function rpData(){
  const st=REC.rm.statuses;
  const rows=S.tickets.filter(t=>{
    const d=t.inDate||t.date||'';
    if(RP.from && (!d||d<RP.from)) return false;
    if(RP.to && (!d||d>RP.to)) return false;
    if(RP.owner && (t.owner||'')!==(RP.owner==='__none'?'':RP.owner)) return false;
    if(RP.cat && (t.cat||'')!==(RP.cat==='__none'?'':RP.cat)) return false;
    return true;
  });
  const cnt=a=>{ const o={}; st.forEach(k=>o[k]=a.filter(x=>x.status===k).length); return o; };
  const grp=key=>{ const m=new Map(); rows.forEach(t=>{ const k=t[key]||'미지정'; if(!m.has(k)) m.set(k,[]); m.get(k).push(t); }); return [...m].map(([k,a])=>({k,n:a.length,c:cnt(a)})).sort((a,b)=>(a.k==='미지정')-(b.k==='미지정')||b.n-a.n||a.k.localeCompare(b.k,'ko')); };
  const done=rows.filter(t=>t.status==='완료').length;
  const ord=t=>st.indexOf(t.status);
  const base=RP.list==='all'?rows.slice():rows.filter(t=>t.status!=='완료');
  const list=base.sort((a,b)=>ord(a)-ord(b)||String(a.inDate||a.date||'').localeCompare(String(b.inDate||b.date||''))||String(a.no).localeCompare(String(b.no),'ko',{numeric:true}));
  const per=(RP.from||RP.to)?((RP.from||'처음')+' ~ '+(RP.to||'현재')):'전체 기간';
  const flt=[RP.owner?'담당자 '+(RP.owner==='__none'?'미지정':RP.owner):'',RP.cat?'분류 '+(RP.cat==='__none'?'미지정':RP.cat):''].filter(Boolean);
  return { st, total:rows.length, c:cnt(rows), done, rate:rows.length?Math.round(done/rows.length*100):0, byOwner:grp('owner'), byCat:grp('cat'), list, listAll:RP.list==='all', per, flt };
}
function rpText(d){
  const cs=c=>d.st.filter(k=>c[k]).map(k=>k+' '+c[k]).join(' · ')||'-';
  const L=['[RM 현황 보고] '+fmtText(todayStr()), '기간: '+d.per+(d.flt.length?' / '+d.flt.join(' / '):''), ''];
  L.push('■ 전체 '+d.total+'건 (완료율 '+d.rate+'%)');
  L.push(d.st.map(k=>k+' '+d.c[k]).join(' / '));
  if(d.total){
    L.push('','■ 담당자별'); d.byOwner.forEach(g=>L.push('- '+g.k+': 총 '+g.n+'건 ('+cs(g.c)+')'));
    L.push('','■ 분류별'); d.byCat.forEach(g=>L.push('- '+g.k+': 총 '+g.n+'건 ('+cs(g.c)+')'));
  }
  L.push('','■ '+(d.listAll?'전체 목록':'미완료 목록')+' ('+d.list.length+'건)');
  if(!d.list.length) L.push('- 해당 항목 없음');
  d.list.forEach(t=>L.push('- '+t.no+' '+t.title+' ['+(t.owner||'미지정')+' · '+t.status+']'));
  return L.join('\n');
}
function rpDraw(d,H){
  const F=FONT, W=760, pad=32, inner=W-pad*2, k=2;
  const c=document.createElement('canvas'); c.width=W*k; c.height=(H||4000)*k;
  const x=c.getContext('2d'); x.scale(k,k); x.textBaseline='alphabetic';
  if(H){ x.fillStyle='#f4f6fa'; x.fillRect(0,0,W,H); x.fillStyle='#fff'; rr(x,12,12,W-24,H-24,18); x.fill(); x.strokeStyle='#e2e6ee'; x.lineWidth=1; x.stroke(); }
  const fit=(t,mw)=>{ t=String(t); if(x.measureText(t).width<=mw) return t; while(t.length>1 && x.measureText(t+'…').width>mw) t=t.slice(0,-1); return t+'…'; };
  let y=pad+8;
  x.font='700 14px '+F; x.fillStyle='#3b5bdb'; x.fillText('RM 현황 보고',pad,y+14); y+=14+10;
  x.font='700 24px '+F; x.fillStyle='#1c2333'; x.fillText(fmtText(todayStr())+' 기준',pad,y+24); y+=24+10;
  x.font='500 13px '+F; x.fillStyle='#6b7488'; x.fillText(fit('기간: '+d.per+(d.flt.length?'  ·  '+d.flt.join(' · '):''),inner),pad,y+13); y+=13+18;
  // total + rate
  x.font='700 20px '+F; x.fillStyle='#1c2333'; x.fillText('전체 '+d.total+'건',pad,y+18);
  x.font='600 14px '+F; x.fillStyle='#2e9e6a'; x.textAlign='right'; x.fillText('완료율 '+d.rate+'%',pad+inner,y+18); x.textAlign='left'; y+=18+10;
  x.fillStyle='#e8ebf2'; rr(x,pad,y,inner,10,5); x.fill();
  if(d.rate>0){ x.fillStyle='#2e9e6a'; rr(x,pad,y,Math.max(10,inner*d.rate/100),10,5); x.fill(); } y+=10+16;
  // tiles
  const n=d.st.length, gap=10, tw=(inner-gap*(n-1))/n;
  d.st.forEach((s,i)=>{ const tx=pad+i*(tw+gap); x.fillStyle='#f4f6fa'; rr(x,tx,y,tw,64,12); x.fill(); x.fillStyle=STC[s]||'#6b7488'; rr(x,tx,y+10,4,44,2); x.fill();
    x.textAlign='center'; x.font='700 24px '+F; x.fillStyle='#1c2333'; x.fillText(String(d.c[s]),tx+tw/2,y+32); x.font='600 12px '+F; x.fillStyle='#6b7488'; x.fillText(s,tx+tw/2,y+52); x.textAlign='left'; });
  y+=64+22;
  const bars=(title,gs)=>{
    if(!gs.length) return;
    x.font='700 16px '+F; x.fillStyle='#1c2333'; x.fillText(title,pad,y+14); y+=14+12;
    const mx=Math.max(...gs.map(g=>g.n)), bx=pad+110, bw=inner-110-44;
    gs.slice(0,12).forEach(g=>{
      x.font='600 14px '+F; x.fillStyle='#1c2333'; x.fillText(fit(g.k,100),pad,y+14);
      let cx=bx; const tot=bw*g.n/mx;
      d.st.forEach(s=>{ if(!g.c[s]) return; const w=tot*g.c[s]/g.n; x.fillStyle=STC[s]||'#aab2c5'; x.fillRect(cx,y+2,w,16); cx+=w; });
      x.font='700 14px '+F; x.fillStyle='#1c2333'; x.textAlign='right'; x.fillText(String(g.n),pad+inner,y+15); x.textAlign='left'; y+=28;
    });
    if(gs.length>12){ x.font='500 12px '+F; x.fillStyle='#6b7488'; x.fillText('외 '+(gs.length-12)+'개',pad,y+10); y+=20; }
    y+=12;
  };
  if(d.total){ bars('담당자별',d.byOwner); bars('분류별',d.byCat); }
  x.font='700 16px '+F; x.fillStyle='#1c2333'; x.fillText((d.listAll?'전체 목록':'미완료 목록')+' ('+d.list.length+'건)',pad,y+14); y+=14+10;
  if(!d.list.length){ x.font='500 14px '+F; x.fillStyle='#6b7488'; x.fillText('해당 항목 없음',pad,y+18); y+=30; }
  d.list.slice(0,15).forEach(t=>{
    x.strokeStyle='#eef0f4'; x.beginPath(); x.moveTo(pad,y); x.lineTo(pad+inner,y); x.stroke();
    x.font='700 13px '+F; x.fillStyle='#3b5bdb'; x.fillText(fit(t.no,80),pad,y+20);
    const tag=(t.owner||'미지정')+' · '+t.status; x.font='600 12px '+F; const tw2=x.measureText(tag).width;
    x.fillStyle=STC[t.status]||'#6b7488'; x.textAlign='right'; x.fillText(tag,pad+inner,y+20); x.textAlign='left';
    x.font='500 14px '+F; x.fillStyle='#1c2333'; x.fillText(fit(t.title,inner-88-tw2-12),pad+88,y+20); y+=30;
  });
  if(d.list.length>15){ x.font='500 12px '+F; x.fillStyle='#6b7488'; x.fillText('외 '+(d.list.length-15)+'건',pad,y+14); y+=22; }
  y+=6; x.font='400 11px '+F; x.fillStyle='#aab2c5'; x.textAlign='right'; x.fillText('Task Manager v'+VERSION,pad+inner,y+10); x.textAlign='left'; y+=10;
  return { c, y };
}
function rpCanvas(d){ const m=rpDraw(d,null); return rpDraw(d,m.y+pad2()).c; }
function pad2(){ return 32; }
function renderRmReport(){
  renderRmSeg('rep'); renderTabs();
  const owners=[...new Set(S.tickets.map(t=>t.owner).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko'));
  const opt=(v,l,sel)=>`<option value="${esc(v)}" ${sel===v?'selected':''}>${esc(l)}</option>`;
  $('rpForm').innerHTML=`<h2>현황 보고 조건</h2>
    <div class="two" style="margin-bottom:12px"><div class="field" style="margin:0"><label>시작일 (접수일자 기준)</label><input type="date" id="rpFrom" value="${esc(RP.from)}"></div>
      <div class="field" style="margin:0"><label>종료일</label><input type="date" id="rpTo" value="${esc(RP.to)}"></div></div>
    <div class="two" style="margin-bottom:12px"><div class="field" style="margin:0"><label>담당자</label><select id="rpOwner">${opt('','전체',RP.owner)}${owners.map(o=>opt(o,o,RP.owner)).join('')}${opt('__none','미지정',RP.owner)}</select></div>
      <div class="field" style="margin:0"><label>분류</label><select id="rpCat">${opt('','전체',RP.cat)}${catNames().map(o=>opt(o,o,RP.cat)).join('')}${opt('__none','미지정',RP.cat)}</select></div></div>
    <div class="field" style="margin:0"><label>목록 표시</label><select id="rpList">${opt('open','미완료만',RP.list)}${opt('all','전체',RP.list)}</select></div>`;
  $('rpOut').innerHTML=`<h2>보고 자료</h2>
    <div id="rpCv" style="border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px"></div>
    <h2 style="margin-top:4px">공유 텍스트</h2>
    <textarea class="tx" id="rpText" rows="14"></textarea>
    <div class="actions" style="margin-top:10px"><button type="button" class="btn" id="rpReset">틀대로 다시 만들기</button></div>
    ${shareBarHtml()}`;
  rpRefresh();
}
function rpRefresh(){
  const d=rpData(), cv=rpCanvas(d); cv.style.cssText='display:block;width:100%;height:auto';
  $('rpCv').innerHTML=''; $('rpCv').appendChild(cv); $('rpText').value=rpText(d);
}
$('v-rmrep').addEventListener('change',e=>{
  const id=e.target.id; if(!['rpFrom','rpTo','rpOwner','rpCat','rpList'].includes(id)) return;
  RP.from=$('rpFrom').value; RP.to=$('rpTo').value; RP.owner=$('rpOwner').value; RP.cat=$('rpCat').value; RP.list=$('rpList').value; rpRefresh();
});
$('v-rmrep').addEventListener('click',async e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.id==='rpReset'){ rpRefresh(); return; }
  if(!['shText','shImg','shShare'].includes(b.id)) return;
  const d=rpData();
  doShare(b.id,{ text:$('rpText').value, canvas:()=>rpCanvas(d), name:'rm_report_'+stamp()+'.png', title:'RM 현황 보고' });
});

/* ---------- 저장소 동기화 ---------- */
const GAS_EMB = (typeof google!=='undefined' && google.script && google.script.run) ? google.script.run : null;
function _cfg(){ if(_cfg.c) return _cfg.c; let c={url:'',key:''}; try{ if(_CFG) c=JSON.parse(_dec(_CFG,'tm-cfg-v1')); }catch(e){} return _cfg.c=c; }
function gasCfg(){ const c=_cfg(); return /^https:\/\/script\.google(usercontent)?\.com\//.test(c.url||'') ? { url:c.url, key:c.key||'' } : null; }
const gasOn = () => !!(GAS_EMB || gasCfg());
const SYNC = { last:null, busy:false, err:'', timer:null, pulled:0, ready:false, pending:false, dirty:false, retry:null };
function gasFetch(c,fn,args,keep){
  return fetch(c.url,{ method:'POST', keepalive:keep===true, headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({ key:c.key||'', fn, args:args||[] }) })
    .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
    .then(t=>{ let j; try{ j=JSON.parse(t); }catch(e){ throw new Error('응답을 해석할 수 없습니다 (웹앱 URL/액세스 권한 확인)'); } if(j&&j.error) throw new Error(j.error); return j.result; });
}
function gasCall(fn,args){
  if(GAS_EMB) return new Promise((res,rej)=>{ GAS_EMB.withSuccessHandler(res).withFailureHandler(rej)[fn](...(args||[])); });
  const c=gasCfg(); if(!c) return Promise.reject(new Error('연동 미설정'));
  return gasFetch(c,fn,args);
}
function syncUI(){
  const box=$('syncBox'); if(!box) return; const on=gasOn(); box.classList.remove('hide');
  $('syncNow').classList.toggle('hide',!on);
  if(!on){ $('syncStat').textContent='저장소 미연동: 데이터가 이 기기(브라우저)에만 저장됩니다. 여러 기기에서 함께 쓰려면 관리자에게 연동 설정을 요청하세요.'; return; }
  $('syncStat').textContent='구글 시트 연동'+(GAS_EMB?'(웹앱)':'')+': '+(SYNC.err?'오류 – '+SYNC.err+(SYNC.dirty?' (자동 재시도 예정)':''):SYNC.busy?'동기화 중…':SYNC.pending?'저장 대기 중…':SYNC.last?'동기화됨 ('+fmtDT(SYNC.last)+')':'대기 중');
}
function gasPush(force,now){
  if(!gasOn() || !SYNC.ready){ if(gasOn()) SYNC.dirty=true; return; }
  clearTimeout(SYNC.timer); SYNC.pending=true; syncUI();
  const run=()=>{
    SYNC.timer=null; SYNC.busy=true; syncUI();
    const json=JSON.stringify(S);
    const p = GAS_EMB ? gasCall('gasSave',[json,S.lastChanged||0,force===true]) : gasFetch(gasCfg(),'gasSave',[json,S.lastChanged||0,force===true],json.length<60000);
    p.then(r=>{
      SYNC.busy=false; SYNC.pending=false;
      if(r&&r.ok){ SYNC.last=Date.now(); SYNC.err=''; SYNC.dirty=false; }
      else if(r&&r.conflict){ SYNC.dirty=false; gasPull(false); }
      else { SYNC.err=(r&&r.error)||'저장 실패'; gasRetry(); }
      syncUI();
    }).catch(er=>{ SYNC.busy=false; SYNC.pending=false; SYNC.err=String((er&&er.message)||er); gasRetry(); syncUI(); });
  };
  if(force===true||now===true) run(); else SYNC.timer=setTimeout(run,1500);
}
function gasRetry(){ SYNC.dirty=true; clearTimeout(SYNC.retry); SYNC.retry=setTimeout(()=>{ if(SYNC.ready) gasPush(false); else gasPull(true); },15000); }
function gasEditing(){ const a=document.activeElement; return !!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.closest && a.closest('.view.on')); }
function gasAdopt(sv,quiet){
  S=normalize(sv); try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){}
  if(SES && PG && PG!=='set'){ try{ rmEdit=null; navigate(PG); }catch(e){} } else if(PG==='set'){ try{ renderSettings(); }catch(e){} }
  try{ renderNav(); }catch(e){}
  if(!quiet) toast('구글 시트의 최신 데이터를 불러왔습니다'); SYNC.last=Date.now();
}
function gasPull(quiet){
  if(!gasOn() || SYNC.busy) return; SYNC.busy=true; syncUI(); SYNC.pulled=Date.now();
  gasCall('gasLoad',[]).then(r=>{
    SYNC.busy=false; SYNC.err=''; SYNC.ready=true;
    let sv=null; try{ sv=r?JSON.parse(r):null; }catch(e){ sv=null; }
    const sl=sv&&sv.lastChanged||0, ll=S.lastChanged||0;
    if(sv && sl>ll){ if(quiet && gasEditing()) SYNC.pulled=0; else gasAdopt(sv,quiet); }
    else if(ll>sl || SYNC.dirty){ SYNC.dirty=false; gasPush(true); }
    else SYNC.last=Date.now();
    syncUI();
  }).catch(er=>{ SYNC.busy=false; SYNC.err=String((er&&er.message)||er); if(SYNC.ready) gasRetry(); syncUI(); });
}
function gasAuto(){ if(gasOn() && document.visibilityState==='visible' && Date.now()-SYNC.pulled>20000) gasPull(true); }
if($('syncNow')) $('syncNow').onclick=()=>{ if(!gasOn()){ toast('연동이 설정되지 않았습니다'); return; } SYNC.busy=false; gasPull(false); };
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){ if(gasOn() && SYNC.ready && SYNC.pending && SYNC.timer){ gasPush(false,true); } }
  else gasAuto();
});
window.addEventListener('pagehide',()=>{ if(gasOn() && SYNC.ready && SYNC.pending && SYNC.timer) gasPush(false,true); });
window.addEventListener('online',()=>{ SYNC.pulled=0; gasAuto(); });
window.addEventListener('pageshow',e=>{ if(e.persisted){ SYNC.pulled=0; gasAuto(); } });
window.addEventListener('focus',gasAuto);
setInterval(()=>{ if(gasOn() && !SYNC.busy && !SYNC.timer && Date.now()-SYNC.pulled>60000) gasAuto(); },30000);

/* boot */
(function(){
  if(!ACCESS){ $('gErr').textContent='접근 모듈을 불러오지 못했습니다.'; return; }
  let c=null,a=null; try{ c=sessionStorage.getItem('tm_code'); a=sessionStorage.getItem('tm_acct'); }catch(e){}
  const u=a&&S.users.find(x=>x.id===a);
  if(c && enterWithCode(c)){ if(u) applyAcct(u); startApp(); }
  else if(u){ SES={ pages:[], settings:null, acct:null, label:'', code:'' }; applyAcct(u); startApp(); }
  else { applyAuthUI(); show('gate'); }
})();
if(gasOn()){ SYNC.pulled=Date.now(); gasPull(true); }
</script>
