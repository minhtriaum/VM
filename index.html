<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>VM Task Manager</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Malgun Gothic",sans-serif;background:#f3f5f9;color:#1f2430;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:100%;max-width:360px;background:#fff;border:1px solid #e1e5ee;border-radius:14px;padding:28px 24px;box-shadow:0 8px 28px rgba(20,30,60,.08)}
h1{font-size:20px;margin:0 0 4px}
p{margin:0 0 18px;color:#6b7385;font-size:13px}
input{width:100%;border:1px solid #cfd5e2;border-radius:10px;padding:12px 14px;font-size:16px;outline:none}
input:focus{border-color:#3b6cf6;box-shadow:0 0 0 3px rgba(59,108,246,.15)}
button{width:100%;margin-top:12px;border:0;border-radius:10px;background:#3b6cf6;color:#fff;font-size:15px;font-weight:600;padding:12px;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
#err{min-height:18px;margin-top:10px;color:#d33;font-size:13px}
</style>
</head>
<body>
<div class="card" id="box">
  <h1>VM Task Manager</h1>
  <p>접근 코드를 입력해 주세요.</p>
  <input id="code" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="접근 코드">
  <button id="go" type="button">입장</button>
  <div id="err" role="alert"></div>
</div>
<script>
(function(){
const _CFG='';
function _ks(key){ let h=2166136261>>>0; for(let i=0;i<key.length;i++){ h^=key.charCodeAt(i); h=Math.imul(h,16777619)>>>0; }
  return function(){ h=(h+0x6D2B79F5)>>>0; let t=h; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)&255; }; }
function _dec(b64,key){ const bin=atob(b64), n=new Uint8Array(bin.length), r=_ks(key); for(let i=0;i<bin.length;i++) n[i]=bin.charCodeAt(i)^r(); return new TextDecoder().decode(n); }
  const $=id=>document.getElementById(id);
  let cfg={url:''}; try{ if(_CFG) cfg=JSON.parse(_dec(_CFG,'tm-cfg-v1')); }catch(e){}
  function call(fn,args,token){
    return fetch(cfg.url,{ method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({ key:token||'', fn:fn, args:args||[] }) })
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
      .then(function(t){ var j; try{ j=JSON.parse(t); }catch(e){ throw new Error('서버 응답을 해석할 수 없습니다'); } if(j&&j.error){ var e=new Error(j.error); e.code=j.code; throw e; } return j.result; });
  }
  function enter(token){
    return call('gateBoot',[],token).then(function(b){
      var tm={ url:cfg.url, token:token, grant:b.grant, data:b.data||'' };
      window.__TM=tm;
      try{ sessionStorage.setItem('tm_gt',token); }catch(e){}
      // 새 문서 안에 인계 값을 직접 넣어, 브라우저가 window를 새로 만들어도(일부 모바일) 값이 유지되게 함
      var dbg=''; try{ var hh=String(b.html||''), best='', re=/<script[^>]*>([\s\S]*?)<\/script>/g, mm; while((mm=re.exec(hh))){ if(mm[1].length>best.length) best=mm[1]; } var big=[]; hh.split('\n').forEach(function(x){ if(x.length>5000) big.push(x.length); }); dbg='len='+hh.length+' nl='+(hh.split('\n').length-1)+' sl='+best.split('\n').length+' big='+big.join(',')+' head='+hh.slice(0,40).replace(/\n/g,'~')+' tail='+hh.slice(-30).replace(/\n/g,'~'); }catch(e){ dbg='dbg-fail'; }
      var diag="window.__DBG="+JSON.stringify(dbg).replace(/</g,'\\u003c')+";window.onerror=function(m,s,l,c){try{var x='';try{var sc=[].slice.call(document.scripts).sort(function(a,b){return b.text.length-a.text.length;})[0];var ls=sc.text.split('\\n');x='\\nL'+l+'='+(ls[l-1]||'').slice(Math.max(0,c-30),c+30)+' (sl='+ls.length+')';}catch(e2){}var d=document.createElement('div');d.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#b3261e;color:#fff;font:12px/1.4 monospace;padding:8px;white-space:pre-wrap;word-break:break-all';d.textContent='오류: '+m+' ('+l+':'+c+')\\n'+window.__DBG+x;(document.body||document.documentElement).appendChild(d);}catch(e){}};";
      var inj='<script>'+diag+'window.__TM='+JSON.stringify(tm).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029')+';<\/script>';
      var html=String(b.html||'');
      if(!/<head[^>]*>/i.test(html)) html=inj+html; else html=html.replace(/<head[^>]*>/i,function(m){ return m+inj; });
      // 앱 본문은 문서 쓰기(document.write) 대신 별도 프레임으로 불러옴
      var fr=document.createElement('iframe');
      fr.setAttribute('allow','clipboard-write; web-share; fullscreen');
      fr.title='VM Task Manager';
      fr.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;border:0;background:#fff';
      fr.src=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));
      document.body.style.padding='0'; document.body.style.background='#fff';
      document.body.appendChild(fr);
      var bx=$('box'); if(bx) bx.style.display='none';
    });
  }
  function msg(t){ $('err').textContent=t||''; }
  function busy(on){ $('go').disabled=on; $('code').disabled=on; $('go').textContent=on?'확인 중…':'입장'; }
  function submit(){
    var v=$('code').value.trim();
    if(!v){ msg('접근 코드를 입력해 주세요.'); return; }
    if(!cfg.url){ msg('서버 주소가 설정되지 않았습니다.'); return; }
    msg(''); busy(true);
    call('gateLogin',[v]).then(function(r){ return enter(r.token); })
      .catch(function(e){ busy(false); $('code').value=''; msg(e.message||'로그인에 실패했습니다.'); $('code').focus(); });
  }
  $('go').onclick=submit;
  $('code').addEventListener('keydown',function(e){ if(e.key==='Enter') submit(); });
  var t=null; try{ t=sessionStorage.getItem('tm_gt'); }catch(e){}
  if(t && cfg.url){ busy(true); msg('이전 세션을 확인하는 중…'); enter(t).catch(function(){ try{ sessionStorage.removeItem('tm_gt'); }catch(e){} busy(false); msg(''); }); }
  else $('code').focus();
})();
</script>
</body>
</html>
